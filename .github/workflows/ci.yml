name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Run deploy guard
        run: npm run test:deploy-guard

      - name: Run proxy allowlist tests
        run: npm run test:proxies

      - name: Scan production bundle for API key/endpoint leaks
        run: |
          set -e
          echo "Scanning dist/ for leaked provider API endpoints and API key assignments..."
          if grep -R --include='*.js' --include='*.html' --include='*.css' -E \
            'api\.groq\.com|apiKey[[:space:]]*[:=][[:space:]]*["'\'''][^"'\''']+["'\''']' \
            dist/; then
            echo "FAIL: Potential provider API key/endpoint leak detected in dist/"
            exit 1
          fi
          echo "No API key/endpoint leaks found."
