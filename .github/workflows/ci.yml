name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only checks out code and runs tests; it never needs write access.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # The test:ui and test:accessibility scripts land with the milestone
      # branches; until they do, npm exits "Missing script" and fails the
      # required check, so these steps only run when the scripts exist.
      - name: Check for browser test suites
        id: browser-tests
        run: |
          node -e '
            const s = require("./package.json").scripts;
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              `ui=${s["test:ui"] ? "yes" : "no"}\naccessibility=${s["test:accessibility"] ? "yes" : "no"}\n`);
          '

      - name: Install Playwright Chromium
        if: steps.browser-tests.outputs.ui == 'yes' || steps.browser-tests.outputs.accessibility == 'yes'
        run: npx playwright install chromium --with-deps

      - name: Run browser tests
        if: steps.browser-tests.outputs.ui == 'yes'
        run: npm run test:ui

      - name: Run accessibility modal tests
        if: steps.browser-tests.outputs.accessibility == 'yes'
        run: npm run test:accessibility

      - name: Run deploy guard
        run: npm run test:deploy-guard

      - name: Run proxy allowlist tests
        run: npm run test:proxies

      - name: Scan production bundle for API key/endpoint leaks
        run: python3 scripts/scan_bundle_for_leaks.py
